# ─────────────────────────────────────────────────────────────────────────────
# NARA configuration
# Neural Assistant · Responsive · Autonomous
#
# Edit this file to point NARA at your vault, pick models, and tune behaviour.
# Secrets (API keys) live in `.env`, never here. Paths may use ~ and $ENV_VARS.
# ─────────────────────────────────────────────────────────────────────────────

persona:
  name: NARA
  wake_word: "Hey Nara"
  # A short description that seeds NARA's system prompt in Phase 2.
  style: >-
    A concise, proactive British-butler-style assistant for a solo founder in
    Bali running Relaxha (spa/wellness), AKA Express Laundry, and hospitality
    marketing. No filler. Speaks briefly out loud; thinks carefully.

models:
  # Small model kept resident for voice/intent/quick chat (Phase 4/6).
  voice_model: "qwen3:4b"
  # Stronger local model, loaded on demand (Phase 6). ~9B is the ceiling on 16 GB.
  # NOTE: verify the exact Ollama tag for your machine before pulling.
  local_model: "qwen3.5:9b"
  # Cloud brain for real reasoning (Phase 2). Under cloud.backend=cli these tiers
  # are advisory (the CLI uses your Claude Code session's model); under
  # cloud.backend=api they select the model per request (Phase 6 routing).
  cloud_model: "claude-sonnet-5"
  cloud_model_light: "claude-haiku-4-5"   # light tasks
  cloud_model_heavy: "claude-opus-4-8"    # hardest tasks
  # Local embedding model for vault RAG (Phase 1), served by Ollama.
  embedding_model: "nomic-embed-text"
  # Phase 6 — keep the local chat model warm in Ollama between turns.
  keep_alive: "30m"

cloud:
  # How NARA reaches Claude for cloud reasoning (Phase 2) and dev work (Phase 3):
  #   cli -> drive the local `claude` CLI / Claude Agent SDK, authenticated with
  #          your Claude Pro/Max subscription via `claude login`. No API key, and
  #          usage counts against your plan's quota. Keep ANTHROPIC_API_KEY UNSET
  #          in this mode, or Claude Code will bill the pay-per-token API instead.
  #   api -> call the Anthropic API directly with ANTHROPIC_API_KEY (pay-per-token).
  #          Unlocks per-request Haiku/Sonnet/Opus routing + precise cost tracking
  #          (the cloud_model_* tiers above and Phase 6 budgeting).
  backend: cli
  timeout_seconds: 120   # cli backend: how long to wait on the `claude` subprocess
  max_tokens: 4096       # api backend: max tokens per reply

agent:
  # Phase 2 text loop.
  local_model: "qwen3:4b"   # small model used for local chat (pull it in Ollama)
  history_turns: 6          # prior turns kept as context
  memory_k: 6               # vault notes retrieved per turn

vault:
  # Absolute path to your Obsidian vault. CHANGE THIS to your real vault.
  path: "~/Obsidian/NARA-Vault"
  # Folders NARA owns inside the vault (created on demand in Phase 1).
  memory_folder: "NARA/Memory"     # facts NARA learns
  daily_folder: "NARA/Daily"       # daily logs
  projects_folder: "NARA/Projects" # Relaxha, Laundry, marketing
  private_folder: "NARA/private"   # never indexed, never sent to the cloud

memory:
  # Where the local vector index is stored (Phase 1).
  index_path: "~/.nara/index.lancedb"
  chunk_size: 500      # ~tokens per chunk
  chunk_overlap: 50
  search_k: 6          # chunks retrieved per query

voice:
  wake_engine: "openwakeword"   # openwakeword | pvporcupine
  stt_model: "small"            # faster-whisper size: tiny | base | small | medium
  tts_engine: "macos"           # kokoro | macos | elevenlabs
  silence_ms: 800               # stop recording after this much silence
  silence_threshold: 0.01       # mic RMS below this is "silence" (lower = more sensitive)
  prespeech_seconds: 6          # give up if no speech is heard within this long
  push_to_talk_hotkey: "cmd+shift+space"

router:
  # Phase 2 heuristics (upgraded to a cloud-weighted policy in Phase 6).
  cloud_context_threshold_tokens: 800
  dev_keywords: [code, repo, build, deploy, debug, refactor, test, commit, PR]
  cloud_keywords: [analyze, plan, compare, research, synthesize, strategy]
  # Phase 6 — escalate an unsure local answer up to the cloud.
  escalate_low_confidence: true
  low_confidence_markers: ["i'm not sure", "i don't know", "not certain", "unable to"]

privacy:
  # Phase 6 — a message matching any of these stays local and never goes to
  # the cloud (sensitive content is answered on-device only).
  sensitive_keywords: [password, secret, private, diary, medical, bank, salary]

dev:
  # Phase 3 — "do my dev work" via Claude Code. Map project names to repo paths;
  # run with:  nara dev <project> "<task>"   (or /dev in the chat REPL).
  max_cost_usd: 2.0        # api-metered ceiling; on a subscription cost is $0
  timeout_seconds: 1800    # max time for one Claude Code run
  projects:
    # name: /path/to/repo   (CHANGE these to your real repos)
    relaxha: "~/code/relaxha"
    laundraos: "~/code/laundraos"

web:
  # Phase 7 — research the web and save a note to your vault.
  #   nara web search "<query>"   ·   nara web url <url>
  # The work is delegated to Claude (cloud engine), which has web tools, so it
  # runs on your subscription with no extra API. Summaries land here:
  save_folder: "NARA/Web"

content:
  # Phase 7 — draft marketing content grounded in your vault notes.
  #   nara draft "<topic>" [--kind caption|listing|outreach] [--bilingual]
  save_folder: "NARA/Content"
  search_k: 5              # vault notes pulled in as the brief

budget:
  # Phase 6 — cloud spend guardrails.
  monthly_cloud_usd: 50
  warn_at_percent: 80

service:
  # Phase 5 — local HTTP service (nara serve) for UIs and scripts.
  host: "127.0.0.1"
  port: 8765

logging:
  path: "~/.nara/logs"
  level: "INFO"    # DEBUG | INFO | WARNING | ERROR
