[project]
name = "nara"
version = "0.1.0"
description = "NARA (Neural Assistant · Responsive · Autonomous) — a JARVIS-style hybrid AI assistant for macOS."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Akanara Digital Solutions" }]
keywords = ["ai", "assistant", "jarvis", "obsidian", "claude", "voice", "macos"]

# Base runtime: configuration, CLI, and the cloud/local reasoning clients.
# Heavier, phase-specific dependencies live in the optional groups below so the
# skeleton stays light on a 16 GB machine.
dependencies = [
    "anthropic>=0.40",
    "ollama>=0.4",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Phase 1 — vault memory + vector index.
memory = [
    "lancedb>=0.13",
    "watchdog>=4.0",
]
# Phase 3 — delegate real coding tasks to Claude Code.
agent = [
    "claude-agent-sdk>=0.1",
]
# Phase 4 — the voice loop (speech-to-text + text-to-speech; push-to-talk).
voice = [
    "faster-whisper>=1.0",
    "sounddevice>=0.5",
    "soundfile>=0.12",
]
# Phase 4 (optional) — always-on "Hey Nara" wake word.
wake = [
    "openwakeword>=0.6",
]
# Convenience: everything NARA needs at runtime.
all = ["nara[memory,agent,voice,wake]"]
# Local development tooling.
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
nara = "core.orchestrator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "voice"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
